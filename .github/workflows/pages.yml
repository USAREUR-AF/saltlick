# The landing page: site/, plus a session recorded against a real saltlick
# instance and the README figure, gathered by site/build.py, published to
# GitHub Pages.
#
# site/build.py builds saltlick, runs the session against a local instance and
# fails when the directory answers differently from what the page describes or
# when a number on the page differs from the tree. A pull request that touches
# the page runs the build and the check; a push to main also deploys, once the
# repository's Pages source is set to "GitHub Actions". Until then the deploy
# job is skipped, not failed.
name: pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/figures/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cmd/**'
      - 'internal/**'
      - 'docs/figures/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and check the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: record the session, copy the figure, check the numbers
        run: python3 -I site/build.py

      - name: leave out what is not part of the page
        run: rm -rf site/.preview site/build.py site/fitcheck.py site/README.md site/.gitignore

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Pages is set up by a repository owner. Until it is, there is nothing
      # to deploy to, so the deploy job does not run.
      - name: is Pages set up to deploy from GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" -q .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set to deploy from GitHub Actions; the page was built and checked, not deployed."
          fi

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
