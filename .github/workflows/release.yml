name: release

# Publishes a container image. This is the ONE workflow that pushes anything,
# and it runs only on a `v*` tag, never on a merge — releasing is a deliberate
# act by whoever runs an instance, which is why ci.yml builds the image and
# throws it away.
#
# The image goes to ghcr.io/<owner>/saltlick, lowercased from the repository
# owner so a fork publishes to its own namespace rather than needing an edit.
# Anyone self-hosting can ignore this entirely and build from the Dockerfile:
# nothing in the repository requires a registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and push (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The directory runs on x86 mgmt hosts and on arm64 Jetsons, so both
      # arches ship under one manifest and a deploy pins the index digest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: derive the lowercase image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/saltlick" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # Print the pin a deployer needs. A tag says which release; the index
      # digest says which bytes, and the digest is what a deploy should pin.
      - name: the pin to deploy
        run: |
          echo "Pin this in the deploying config:"
          echo "  ${{ steps.name.outputs.image }}:${{ github.ref_name }}@${{ steps.build.outputs.digest }}"
