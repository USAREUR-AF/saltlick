# saltlick, self-hosted. This is the expected way to run the directory: a
# coalition body runs it inside their own network.
#
#   cp .env.example .env    # edit it
#   docker compose up -d
#
# Two containers: the directory, and Caddy in front of it terminating TLS. The
# directory is not published on a host port; only Caddy is.
#
# The directory is NOT meant to be reachable from the internet — see README.md.
# By default the ports below bind to 127.0.0.1, which reaches nothing but this
# machine. Set BIND_ADDR in .env to the internal address other people reach you
# on. Do not set it to 0.0.0.0 on a host with a public interface.
#
# Already have a reverse proxy? Delete the `caddy` service and the `caddy_*`
# volumes, give `saltlick` a port mapping instead:
#
#     ports:
#       - "${BIND_ADDR:-127.0.0.1}:8080:8080"
#
# then point your proxy at it and terminate TLS there.

services:
  saltlick:
    image: ${SALTLICK_IMAGE:-ghcr.io/usareur-af/saltlick:latest}
    restart: unless-stopped
    environment:
      # Set explicitly: the binary's own default is 127.0.0.1:8080, which in a
      # container would be unreachable from Caddy. The network namespace is the
      # boundary here, not the bind address.
      SALTLICK_ADDR: ":8080"
      SALTLICK_DB: "/data/saltlick.db"
    volumes:
      # The DIRECTORY /data, never the database file. SQLite runs in WAL mode,
      # so saltlick.db has -wal and -shm siblings that must sit on the same
      # persistent volume. Bind-mounting just saltlick.db would leave the
      # write-ahead log in the container's writable layer, and committed writes
      # would disappear on restart while everything still looked healthy.
      - saltlick_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - saltlick
    ports:
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
    environment:
      SALTLICK_DOMAIN: ${SALTLICK_DOMAIN:?set SALTLICK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Your own certificate and key, if you have them. Create the directory
      # even if empty; see the Caddyfile for how to switch to using them.
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # The SQLite database and its WAL siblings. This is the only state that
  # matters; everything else can be recreated by pulling the image again.
  saltlick_data:
  # Caddy's local CA key and issued certificates. Deleting it makes Caddy mint
  # a new CA, which every client would then have to trust afresh.
  caddy_data:
  caddy_config:
